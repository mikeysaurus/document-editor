<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SS14 Document Formatter</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" type="text/css" href="theme.css"/>

  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div id="toolbar">
    <!-- buttons… -->
    <div class="multiple-buttons">
      <button class="button-formatting" onclick="insertTag('bold')">Bold</button>
      <button class="button-formatting" onclick="insertTag('italic')">Italic</button>
      <button class="button-formatting" onclick="insertTag('bolditalic')">Bold Italic</button>
    </div>
    <button class="button-formatting" onclick="insertTag('bullet')">Bullet</button>
    <div class="multiple-buttons">
      <button onclick="centerText()">Center Text</button>
      <button onclick="insertTag('mono')">Monospace</button>
    </div>
    <div class="multiple-buttons">
      <button class="button-headers" onclick="insertTag('head=1')">H1</button>
      <button class="button-headers" onclick="insertTag('head=2')">H2</button>
      <button class="button-headers" onclick="insertTag('head=3')">H3</button>
    </div>
    <div class="multiple-buttons">
      <button class="button-logos" onclick="insertTag('cclogo')">cclogo</button>
      <button class="button-logos" onclick="insertTag('logo')">logo</button>
      <button class="button-logos" onclick="insertTag('slogo')">slogo</button>
    </div>
    <div class="multiple-buttons">
      <button class="button-colors" onclick="insertHexColor()">Hex Color</button>
      <button class="button-colors" onclick="toggleColorPicker()">Color Picker</button>
    </div>
    <button onclick="document.getElementById('file-input').click()">Import .txt</button>
    <input type="file" id="file-input" accept=".txt" style="display:none">
    <button onclick="saveTextAsFile()">Save as .txt</button>
    <button onclick="saveRenderAsImage()">Save as Image</button>
    <div id="template-picker"></div>
  </div>

    <!-- Editor for user input -->
    <textarea id="editor" placeholder="Type here and watch with amazement as it's rendered in the render area..."></textarea>

    <!-- Render area -->
    <div id="render-container">
        <div id="render-wrapper">
            <div id="render"></div>
        </div>

        <!-- Content below render -->
        <div class="image-container">
          <div class="badge-container">
            <p>
              <a href="https://github.com/ss14Starlight/Starlight.Paperwork/tree/main" target="_blank" rel="noopener noreferrer">
                <img alt="Paperwork Templates Badge" src="https://img.shields.io/badge/github-templates-purple?logo=github">
              </a>
              <a href="https://github.com/ss14Starlight/Starlight.DocumentEditor" target="_blank" rel="noopener noreferrer">
                <img alt="Document Editor Badge" src="https://img.shields.io/badge/github-repo-blue?logo=github">
              </a>
              <img alt="Hits Counter" src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fss14starlight.github.io%2FStarlight.DocumentEditor%2F&label=Bureaucrats&icon=pencil-square&color=%23198754&message=&style=flat&tz=US%2FPacific">
            </p>
          </div>
          <p class="image-text">Ping @mikey.saurus on the Starlight Discord if you have any questions.</p>
          <p class="image-text">Originally made by Simon / Big Dave / Fred Blehurst & Tunguso4ka</p>
        </div>
    </div>

  <div id="color-picker" style="display:none;position:absolute;grid-template-columns:repeat(auto-fill,30px);gap:5px;"></div>

  <script type="text/javascript" src="logic.js"></script>
</body>
</html>
